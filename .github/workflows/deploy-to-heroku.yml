# This is a basic workflow to help you get started with Actions

name: Deploy to Heroku

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    
jobs:
  # Deployment job
  deploy:
    environment:
      name: heroku
      url: https://theidserver-duende.herokuapp.com/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build and Push Docker image to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: "theidserver-duende"
        run: |
          # 1. Installation rapide de la CLI Heroku
          curl -s https://cli-assets.heroku.com/install.sh | sh
      
          # 2. Authentification et Build Docker (déjà disponible)
          echo ${{ secrets.HEROKU_API_KEY }} | docker login --username=_ --password-stdin registry.heroku.com
          docker build -t registry.heroku.com/${HEROKU_APP_NAME}/web -f src/Aguacongas.TheIdServer.Duende/Dockerfile .
          docker push registry.heroku.com/${HEROKU_APP_NAME}/web
          heroku container:release web --app ${HEROKU_APP_NAME}
        
